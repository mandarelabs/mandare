name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  checks:
    name: build · typecheck · lint · test (node ${{ matrix.node }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node: ['22', '24']
    env:
      # node:sqlite is unflagged from 22.13 / 23.4; the flag is a harmless
      # no-op where it's already unflagged and required on older 22.x.
      NODE_OPTIONS: ${{ matrix.node == '22' && '--experimental-sqlite' || '' }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6.0.10
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: ${{ matrix.node }}
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm build
      - run: pnpm typecheck
      - run: pnpm lint
      - run: pnpm test

  red-team:
    name: red-team tamper suite (rule R5)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6.0.10
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '24'
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm build
      - run: pnpm red-team

  smoke:
    name: smoke + runaway-cap demo (mock providers, no secrets)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6.0.10
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '24'
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm build
      - run: pnpm smoke
      # The S2 acceptance demo (R7): a runaway loop must die at the €20 cap,
      # with the refusal on the ledger and counters equal to a fresh replay.
      - run: pnpm demo
      # The S3 acceptance demo (R7): a stolen vault token is dead paper, and
      # `mandare kill` halts a running agent mid-task with the refusal on the
      # ledger. Uses the vault's explicit file backend (no OS keychain in CI).
      - run: pnpm demo:dead-paper
      # The S4 acceptance demo (R7): one signed mandate replaces 40 permission
      # prompts — passport-authenticated multi-step task, async human approval
      # (approve + deny), the whole sequence proven by `mandare verify`.
      # Mock notifier (file channel), no secrets.
      - run: pnpm demo:mandate
      # The S5 acceptance demo (R7): the card declines AT THE NETWORK — one
      # €20 mandate across both rails; LLM spend eats the cap, an in-cap
      # purchase approves, the next declines via the authorization webhook,
      # `mandare kill` turns the card to dead plastic. Mock Stripe, REAL
      # webhook signatures, no secrets.
      - run: pnpm demo:card
      # The S6 acceptance demo (R7): the rewrite that can't hide — heads
      # streamed to the reference witness, a truncated copy and a real-door-
      # key rewrite both pass self-anchored verification and both are
      # CONVICTED by `mandare verify --witness`; `mandare certify` emits a
      # selective-disclosure integrity certificate a third party verifies
      # with no ledger access. Real witness server, mock anchor, no secrets.
      - run: pnpm demo:witness
      # S7 packaging smokes: the compose topology WITHOUT docker (the exact
      # container entry scripts as local processes), the OpenClaw skill's
      # documented commands E2E + trust envelope (incl. tamper + signed
      # cases), and the zero-dep Python client against a real token-auth
      # door (accept + BAD_POP).
      - run: pnpm stack-smoke
      - run: pnpm skill-smoke
      - run: pnpm sdk-py-smoke
      # R-1: the npm publish set (release.yml PUBLISH_PACKAGES) packed and
      # installed into an empty directory from its own tarballs — the
      # installed `mandare help` and an MCP initialize + tools/list must work.
      - run: pnpm pack-install-smoke
      - name: Python client unit tests (pinned cross-language vector)
        working-directory: packages/sdk-py
        run: python3 -m unittest discover -s tests -v

  # S7 clean-machine acceptance: a stranger following ONLY the public docs
  # gets a running gateway that stops a runaway agent at a budget. The
  # script asserts the quickstart commands appear VERBATIM in the docs and
  # README, then executes the documented solo path (./install.sh, pnpm demo)
  # on a FRESH COPY of the repo. Docs drift or a broken install fails CI.
  docs-install-smoke:
    name: docs-install-smoke (fresh copy, documented commands only)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6.0.10
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '24'
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm docs-install-smoke

  # S7: the README's ACTUAL 3-command quickstart, in real containers — the
  # Hacker-News-reader path. Asserts the demo passes AND the dashboard
  # renders real ledger data from the run.
  compose-smoke:
    name: compose-smoke (docker compose quickstart)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - run: docker compose up -d --wait
        timeout-minutes: 15
      - name: Run the quickstart demo
        run: |
          docker compose run --rm demo | tee /tmp/demo.out
          grep -q "DEMO PASS" /tmp/demo.out
          # The loop must die on the €20 SPEND cap at the call the docs
          # promise — not on the velocity limiter or any other refusal (D-1).
          # stack-smoke asserts this exact line against the demo's output.
          grep -q "REFUSED: call #24 PER_DAY_EXCEEDED" /tmp/demo.out
      - name: Dashboard renders real ledger data
        run: |
          curl -sf http://127.0.0.1:8788/ > /tmp/dash.html
          grep -q "did:mandare:dev-agent" /tmp/dash.html
          grep -q ">VALID<" /tmp/dash.html
          # Both the counters badge AND the witness badge must be green —
          # a red/failed witness badge on the healthy quickstart stack is
          # the C2 inversion coming back.
          test "$(grep -o '>CONSISTENT<' /tmp/dash.html | wc -l)" -ge 2
          curl -sf http://127.0.0.1:8788/trail > /tmp/trail.html
          grep -q "llm.call.denied" /tmp/trail.html
      - name: Gateway health + witness reachable
        run: |
          curl -sf http://127.0.0.1:8484/healthz
          curl -sf http://127.0.0.1:9411/healthz
      - if: always()
        run: docker compose logs --tail 80 && docker compose down -v
