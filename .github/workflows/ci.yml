name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  checks:
    name: build · typecheck · lint · test (node ${{ matrix.node }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node: ['22', '24']
    env:
      # node:sqlite is unflagged from 22.13 / 23.4; the flag is a harmless
      # no-op where it's already unflagged and required on older 22.x.
      NODE_OPTIONS: ${{ matrix.node == '22' && '--experimental-sqlite' || '' }}
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: ${{ matrix.node }}
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm build
      - run: pnpm typecheck
      - run: pnpm lint
      - run: pnpm test

  red-team:
    name: red-team tamper suite (rule R5)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm build
      - run: pnpm red-team

  smoke:
    name: smoke + runaway-cap demo (mock providers, no secrets)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm build
      - run: pnpm smoke
      # The S2 acceptance demo (R7): a runaway loop must die at the €20 cap,
      # with the refusal on the ledger and counters equal to a fresh replay.
      - run: pnpm demo
      # The S3 acceptance demo (R7): a stolen vault token is dead paper, and
      # `mandare kill` halts a running agent mid-task with the refusal on the
      # ledger. Uses the vault's explicit file backend (no OS keychain in CI).
      - run: pnpm demo:dead-paper
      # The S4 acceptance demo (R7): one signed mandate replaces 40 permission
      # prompts — passport-authenticated multi-step task, async human approval
      # (approve + deny), the whole sequence proven by `mandare verify`.
      # Mock notifier (file channel), no secrets.
      - run: pnpm demo:mandate
