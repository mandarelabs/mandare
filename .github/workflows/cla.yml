name: CLA Assistant

on:
  issue_comment:
    types: [created]
  pull_request_target:
    types: [opened, closed, synchronize]

permissions:
  actions: write
  contents: write
  pull-requests: write
  statuses: write

jobs:
  cla:
    # Dependabot can't sign, and the allowlist can't match it: its commits have no
    # GitHub author user, so the action falls back to the committer `web-flow`.
    # Skip by PR opener instead (set by GitHub, not by commit metadata).
    if: (github.event.pull_request.user.login || github.event.issue.user.login) != 'dependabot[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: CLA Assistant Lite
        if: (github.event.comment.body == 'recheck' || github.event.comment.body == 'I have read the CLA Document and I hereby sign the CLA') || github.event_name == 'pull_request_target'
        uses: contributor-assistant/github-action@ca4a40a7d1004f18d9960b404b97e5f30a505a08 # v2.6.1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          path-to-signatures: 'signatures/version1/cla.json'
          path-to-document: 'https://github.com/mandarelabs/mandare/blob/main/CLA.md'
          branch: 'cla-signatures'
          # Comma-separated GitHub logins that never need to sign; `*` wildcards allowed.
          allowlist: 'dependabot[bot],github-actions[bot],art-mandarelabs'
          custom-notsigned-prcomment: >
            Thanks for the contribution! Before we can merge, please read our
            [CLA](https://github.com/mandarelabs/mandare/blob/main/CLA.md) and
            sign by commenting: "I have read the CLA Document and I hereby sign the CLA"
